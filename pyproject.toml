[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-lab"
version = "0.1.0"
description = "Research-based industrial control engineering laboratory: models, controllers, simulations, experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "robotjaol" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
notebooks = [
  "matplotlib>=3.8",
  "pandas>=2.1",
  "control>=0.10",
  "nbformat>=5.9",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
]
development = [
  "matplotlib>=3.8",
  "pandas>=2.1",
  "control>=0.10",
  "pytest>=8.0",
  "ruff>=0.4",
  "nbformat>=5.9",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/control_lab"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E702", "E741", "E731"]
"tools/specs/*.py" = ["E702", "E741", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long running tests"]
