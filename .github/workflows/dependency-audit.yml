name: dependency-audit
on:
  schedule: [{ cron: "17 3 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[development]" && pip-audit
      - name: Audit the preview's npm dev dependencies
        run: npm install --package-lock-only --no-audit --no-fund && npm audit --omit=dev
        working-directory: app
